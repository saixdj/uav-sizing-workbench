<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive step-by-step sizing of small electric and fueled UAVs, following Brandt's handbook chapter.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>UAV Sizing Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a Notion-style workspace. Quiet sidebar of steps, one document column, a live result rail. */
:root {
  --bg: #ffffff; --side: #f7f7f5; --fill: #f1f1ef; --hover: #ecebe8; --line: #e6e5e2;
  --fg: #2f2e2b; --fg2: #6b6a65; --muted: #91908a; --accent: #2383e2; --accentbg: #e7f2fc;
  --ok: #0b7a0b; --bad: #c62f2f; --warnbg: #fbecdd;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --grid: #ecebe7; --axis: #cfcec8;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --math: "Cambria Math", "STIX Two Math", "Latin Modern Math", math, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #191919; --side: #202020; --fill: #2a2a29; --hover: #313130; --line: #333331;
  --fg: #e8e7e3; --fg2: #a9a8a2; --muted: #85847e; --accent: #529cca; --accentbg: #1f3442;
  --ok: #3cc13c; --bad: #ef6b6b; --warnbg: #3a2a1c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --grid: #2b2b2a; --axis: #41413e; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #191919; --side: #202020; --fill: #2a2a29; --hover: #313130; --line: #333331;
  --fg: #e8e7e3; --fg2: #a9a8a2; --muted: #85847e; --accent: #529cca; --accentbg: #1f3442;
  --ok: #3cc13c; --bad: #ef6b6b; --warnbg: #3a2a1c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --grid: #2b2b2a; --axis: #41413e; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.6 var(--sans); }
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr) 288px; min-height: 100%; }
aside.side { background: var(--side); border-right: 1px solid var(--line); padding-block: 16px; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.brand { font-weight: 600; font-size: 14px; padding: 2px 8px; }
.brand small { display: block; font-weight: 400; font-size: 12px; color: var(--fg2); line-height: 1.4; }
#modeHost { padding: 0 8px; }
nav#nav { display: flex; flex-direction: column; gap: 1px; }
.nav-i { display: flex; align-items: center; gap: 9px; padding: 5px 8px; border-radius: 5px; color: var(--fg2); text-decoration: none; font-size: 14px; white-space: nowrap; }
.nav-i .n { width: 18px; height: 18px; flex: none; display: grid; place-items: center; font: 500 11px var(--mono); border-radius: 4px; background: var(--fill); }
.nav-i:hover { background: var(--hover); }
.nav-i[aria-current] { background: var(--hover); color: var(--fg); font-weight: 500; }
.nav-i[aria-current] .n { background: var(--accent); color: #fff; }
.side-foot { margin-top: auto; padding: 0 8px; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--fg2); line-height: 1.45; }
main { min-width: 0; padding-block: 44px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#page { max-width: 740px; margin: 0 auto; }
.crumb { font-size: 13px; color: var(--fg2); display: flex; gap: 6px; }
.crumb span { color: var(--muted); }
h1 { font-size: 34px; line-height: 1.2; font-weight: 700; letter-spacing: -.012em; margin: 6px 0 8px; text-wrap: balance; }
.lede { font-size: 16.5px; color: var(--fg2); margin: 0 0 20px; max-width: 64ch; }
h3 { font-size: 16px; font-weight: 600; margin: 8px 0 -4px; }
.body { display: flex; flex-direction: column; gap: 16px; }
.body p { margin: 0; max-width: 68ch; }
.note { font-size: 13.5px; color: var(--fg2); }
.tag { font: 500 10.5px/1 var(--sans); padding: 3px 5px; border-radius: 3px; white-space: nowrap; }
.tag-ch { background: var(--accentbg); color: var(--accent); }
.tag-fig { background: var(--fill); color: var(--fg); }
.tag-ex { background: var(--fill); color: var(--fg2); }
.eq { background: var(--side); border-radius: 6px; padding: 14px 44px 14px 14px; position: relative; overflow-x: auto; }
.eq math { font-family: var(--math); font-size: 17px; }
.eqn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 400 12px var(--mono); color: var(--fg2); background: var(--side); padding-left: 4px; }
.live { font: 400 13px/1.5 var(--mono); color: var(--fg); background: var(--fill); padding: 9px 12px; border-radius: 6px; overflow-wrap: anywhere; }
.ctls { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px 28px; }
.ctl { min-width: 0; }
.ctl label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13.5px; font-weight: 500; }
.ctl-row { display: flex; align-items: center; gap: 8px; }
.ctl-row input[type=range] { flex: 1; min-width: 60px; accent-color: var(--accent); height: 22px; }
input[type=number] { font: 400 13px var(--mono); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; width: 76px; font-variant-numeric: tabular-nums; }
.unit { font-size: 12px; color: var(--fg2); min-width: 42px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg { display: inline-flex; gap: 2px; background: var(--fill); padding: 2px; border-radius: 6px; max-width: 100%; flex-wrap: wrap; }
.seg button { font: 500 13px var(--sans); color: var(--fg2); background: none; border: 0; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
.seg button[aria-checked="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
.side .seg { display: flex; } .side .seg button { flex: 1; }
.btn { font: 500 13px var(--sans); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; cursor: pointer; }
.btn:hover { background: var(--hover); }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; }
.callout { background: var(--side); border-radius: 6px; padding: 12px 14px; font-size: 14px; }
.callout.muted { color: var(--fg2); }
.callout.warn { background: var(--warnbg); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.card { text-align: left; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.card:hover { background: var(--side); }
.card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card svg { color: var(--fg2); }
.card span { font-size: 13px; color: var(--fg2); line-height: 1.4; }
.figure { background: var(--side); border-radius: 8px; display: flex; justify-content: center; min-height: 330px; overflow: hidden; }
.sk-w { fill: var(--s1); fill-opacity: .22; stroke: var(--s1); stroke-width: 1.5; }
.sk-t { fill: var(--s1); fill-opacity: .22; stroke: var(--s1); stroke-width: 1.5; }
.sk-f { fill: var(--bg); stroke: var(--fg2); stroke-width: 1.5; }
.sk-p { stroke: var(--fg); stroke-width: 3; stroke-linecap: round; }
.sk-l { fill: none; stroke: var(--muted); stroke-width: 1; }
.sk-d { fill: var(--fg2); }
.sk-tx { fill: var(--fg2); font: 400 12px var(--sans); }
.ghost { opacity: .4; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 14px; }
.stat { min-width: 0; }
.stat span { display: block; font-size: 12.5px; color: var(--fg2); }
.stat b { font-size: 21px; font-weight: 600; }
.stat em { font-style: normal; font-size: 12px; color: var(--fg2); margin-left: 4px; }
.pill-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.pill { display: inline-flex; gap: 6px; align-items: baseline; font-size: 13.5px; font-weight: 500; }
.pill.ok b, .ok { color: var(--ok); } .pill.bad b, .bad { color: var(--bad); }
.pill.ok, .pill.bad { color: var(--fg); }
.dim { color: var(--muted); }
.plot { min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--fg2); margin-bottom: 6px; }
.leg { display: inline-flex; align-items: center; gap: 6px; }
.stage { position: relative; touch-action: pan-y; }
.stage svg { display: block; width: 100%; }
.stage svg.over { position: absolute; inset: 0; pointer-events: none; }
.grid { stroke: var(--grid); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1; }
.tick { fill: var(--muted); font: 400 11px var(--mono); }
.axl { fill: var(--fg2); font: 400 12px var(--sans); }
.mk { fill: var(--fg); font: 500 12px var(--sans); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
.region { fill: var(--accent); fill-opacity: .09; }
.tip { position: absolute; pointer-events: none; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font-size: 12px; min-width: 150px; box-shadow: 0 3px 10px rgba(0, 0, 0, .1); z-index: 3; }
.th { font-weight: 600; margin-bottom: 3px; }
.tr { display: flex; align-items: center; gap: 6px; color: var(--fg2); line-height: 1.55; }
.tr i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.tr b { margin-left: auto; color: var(--fg); font: 500 12px var(--mono); padding-left: 10px; }
.tr-sum { border-top: 1px solid var(--line); margin-top: 3px; padding-top: 3px; }
.scroll { overflow-x: auto; }
.tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tbl th { text-align: left; font-weight: 500; color: var(--fg2); font-size: 12.5px; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tfoot td { font-weight: 600; border-bottom: 0; }
.tbl input[type=number] { width: 62px; border-color: transparent; background: var(--fill); }
.tbl .ck { width: 24px; padding-right: 0; }
.tbl .ck input { accent-color: var(--accent); }
.num { font: 400 13px var(--mono); font-variant-numeric: tabular-nums; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; }
.barc { min-width: 110px; }
.bar { display: block; height: 8px; background: var(--s1); border-radius: 0 4px 4px 0; }
.stack { display: flex; gap: 2px; height: 28px; margin-bottom: 8px; }
.stack div { min-width: 2px; }
.stack div:first-child { border-radius: 4px 0 0 4px; } .stack div:last-child { border-radius: 0 4px 4px 0; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.two > div { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
details { border-top: 1px solid var(--line); padding-top: 8px; font-size: 14px; }
summary { cursor: pointer; font-weight: 500; }
details > div { padding-top: 6px; color: var(--fg2); display: flex; flex-direction: column; gap: 8px; }
.pager { display: flex; justify-content: space-between; margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--line); gap: 12px; }
.pager a { color: var(--fg); text-decoration: none; font-weight: 500; font-size: 14px; padding: 4px 8px; border-radius: 5px; }
.pager a:hover { background: var(--hover); }
aside.rail { border-left: 1px solid var(--line); padding: 20px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.rail-h { font-size: 12.5px; font-weight: 500; color: var(--fg2); }
#railSketch { background: var(--side); border-radius: 8px; min-height: 210px; overflow: hidden; }
#railStats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
#railStats div { min-width: 0; }
#railStats span { display: block; font-size: 12px; color: var(--fg2); }
#railStats b { font-size: 19px; font-weight: 600; }
#railStats em { font-style: normal; font-size: 11.5px; color: var(--fg2); margin-left: 3px; }
#railPill { display: flex; flex-direction: column; gap: 4px; }
@media (max-width: 1160px) {
  .app { grid-template-columns: 216px minmax(0, 1fr); }
  aside.rail { grid-column: 2; grid-row: 1; position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 5; background: var(--bg); border-left: 0; border-bottom: 1px solid var(--line); padding: 10px 16px; gap: 6px; }
  .rail-h, #railSketch { display: none; }
  #railStats { display: flex; flex-wrap: wrap; gap: 4px 18px; }
  #railStats b { font-size: 15px; } #railStats span { font-size: 11px; }
  main { grid-column: 2; grid-row: 2; padding-top: 24px; }
  aside.side { grid-row: 1 / span 2; }
}
@media (max-width: 760px) {
  .app { display: flex; flex-direction: column; }
  aside.side { order: 0; } aside.rail { order: 1; } main { order: 2; }
  aside.side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); gap: 8px; }
  nav#nav { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .side-foot { display: none; }
  .brand, #modeHost { padding: 0; }
  aside.rail { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #railStats div:nth-child(n+4) { display: none; }
  h1 { font-size: 28px; }
  .eq { padding-right: 14px; } .eqn { position: static; transform: none; display: block; text-align: right; padding: 4px 0 0; }
  .eq math { font-size: 15px; }
}
@media (prefers-reduced-motion: no-preference) { .nav-i, .card, .btn { transition: background .12s; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">UAV Sizing Workbench<small>After Brandt, Handbook of UAVs, ch. 10</small></div>
    <div id="modeHost"></div>
    <nav id="nav" aria-label="Sizing steps"></nav>
    <div class="side-foot">
      <div>Each input is tagged Chapter, Read from figure, or Example.</div>
      <button type="button" class="btn" id="reset">Reset this aircraft</button>
    </div>
  </aside>
  <main><div id="page"></div></main>
  <aside class="rail" aria-label="Live result">
    <div class="rail-h">Live result, plan view to scale</div>
    <div id="railSketch"></div>
    <div id="railStats"></div>
    <div id="railPill"></div>
  </aside>
</div>
<script>
/* Sizing model: Brandt, Small UAV Design Development and Sizing. Units: lb, ft, s. */
const G = 32.174, WH_TO_FTLB = 2655.22, LB_PER_G = 1 / 453.592;
const FIG_10_5 = [[17,.125],[25,.175],[31,.225],[36,.25],[41,.28],[50,.42],[55,.43],[57,.49],[60.5,.53],[63,.57],[65.5,.61],[68,.665]];

const dynQ = (rho, V) => 0.5 * rho * V * V;
const polarCD = (p, CL) => p.CDo + p.k1 * CL * CL + p.k2 * CL;

/* Eq. 10.3 */
function masterTW(p, wl, c, rho) {
  const q = dynQ(rho, c.V), nb = c.n * c.beta;
  const drag = (q / c.alpha) * (p.CDo / wl + p.k1 * (nb / q) ** 2 * wl + p.k2 * (nb / q));
  const excess = (c.beta / c.alpha) * (c.roc / c.V + c.acc / G);
  return drag + excess;
}
/* CL = nW/qS at n = 1, CLmax reached at the launch or landing speed */
const wingLoadingLimit = (lim, rho, beta = 1) => dynQ(rho, lim.V) * lim.CLmax / beta;

function requiredTW(p, wl, cons, rho) {
  let tw = -Infinity, id = null;
  for (const c of cons) { if (c.on === false) continue; const v = masterTW(p, wl, c, rho); if (v > tw) { tw = v; id = c.id; } }
  return { tw, id };
}
function idealPoint(p, cons, lim, rho, wlMaxAxis) {
  const top = lim.on === false ? wlMaxAxis : Math.min(wlMaxAxis, wingLoadingLimit(lim, rho));
  let best = { wl: top, tw: Infinity };
  for (let i = 1; i <= 400; i++) {
    const wl = top * i / 400, r = requiredTW(p, wl, cons, rho).tw;
    if (r < best.tw) best = { wl, tw: r };
  }
  return best;
}
const interp = (pts, x) => {
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]) {
    const [a, b] = pts[i - 1], [c, d] = pts[i];
    return b + (d - b) * (x - a) / (c - a);
  }
  return pts[pts.length - 1][1];
};
const etaOf = (m, V) => m.etaSource === 'fig' ? interp(FIG_10_5, V) : m.etaMotor * m.etaProp;

/* Eqs. 10.7-10.10. Weight fraction of the battery. */
function batteryFraction(p, m, wl, rho, V = m.Vc) {
  const q = dynQ(rho, V), CL = wl / q, CD = polarCD(p, CL), LD = CL / CD;
  const eFt = m.e * WH_TO_FTLB, eta = etaOf(m, V), t = m.tHr * 3600;
  const cruise = (V * t / LD) / (eFt * eta);
  const climb = m.dh / (eFt * eta);
  return { frac: m.approx ? cruise : cruise + climb, cruise, climb, LD, CL, CD, eta };
}
/* Eq. 10.4 applied to one short leg */
function legFuel(p, leg, beta, wl, cPerS, rho) {
  const q = dynQ(rho, leg.V), nb = leg.n * beta;
  const steady = cPerS * q * (p.CDo / wl + p.k1 * (nb / q) ** 2 * wl + p.k2 * (nb / q)) * leg.dt;
  const energy = cPerS * beta * (leg.dh / leg.V + leg.dV / G);
  return steady + energy;
}
/* Leg-by-leg beta bookkeeping; long legs split per Sec. 10.4 */
function missionFuel(p, legs, wl, cPerHr, rho) {
  const cPerS = cPerHr / 3600;
  let beta = 1; const rows = [];
  for (const leg of legs) {
    const b0 = beta, N = leg.split ? 40 : 1;
    let f = 0;
    for (let i = 0; i < N; i++) {
      const df = legFuel(p, { ...leg, dt: leg.dt / N, dh: leg.dh / N, dV: leg.dV / N }, beta, wl, cPerS, rho);
      f += df; beta -= df;
    }
    rows.push({ id: leg.id, name: leg.name, beta: b0, fuel: f, dt: leg.dt });
  }
  return { rows, total: 1 - beta, betaEnd: beta };
}
/* Eq. 10.1 / 10.6 */
function sizeAircraft(wlTotal, parts, Wp) {
  const left = wlTotal - parts.airframe - parts.energy - parts.power;
  const S = left > 0 ? Wp / left : Infinity;
  return { left, S, W: S * wlTotal, feasible: left > 0 };
}
function electricParts(p, m, wl, tw, rho, airframe) {
  const b = batteryFraction(p, m, wl, rho);
  return { parts: { airframe, energy: b.frac * wl, power: tw * wl / m.twEngine }, b };
}
/* Sec. 10.5, 10.6.5: fuselage held, wing resized. One pass at wing area S. */
function polarAt(p, it, S) {
  return { ...p, CDo: p.CDo * ((1 - it.dragShare) + it.dragShare * it.Sref / S) };
}
const airframeAt = (a, it, S) => a * ((1 - it.weightShare) + it.weightShare * it.Sref / S);

function iterateSizing(pass, it) {
  const hist = []; let S = it.Sref;
  for (let i = 0; i < it.maxIter; i++) {
    const r = pass(S);
    if (!r.feasible) { hist.push({ i, S, Snew: Infinity, CDo: r.CDo, tw: r.tw }); return { hist, status: 'nosolution' }; }
    const change = Math.abs(r.S - S) / S;
    hist.push({ i, S, Snew: r.S, CDo: r.CDo, tw: r.tw, change });
    if (change < it.tol) return { hist, status: 'converged', S: r.S };
    S = it.damp ? 0.5 * (S + r.S) : r.S;
  }
  return { hist, status: 'notconverged' };
}

/* ---------- presets ---------- */
const presets = () => ({
  electric: {
    polar: { CDo: 0.0113, k1: 0.1, k2: 0 }, AR: 4, rho: 0.002377, Wp: 0.22, wl: 1.1, tw: 0.21,
    cons: [
      { id: 'c1', name: 'Cruise 50 ft/s', V: 50, n: 1, roc: 0, acc: 0, alpha: 1, beta: 1, on: true },
      { id: 'c2', name: 'Cruise 30 ft/s', V: 30, n: 1, roc: 0, acc: 0, alpha: 1, beta: 1, on: true },
      { id: 'c3', name: '2g turn', V: 50, n: 2, roc: 0, acc: 0, alpha: 1, beta: 1, on: true },

    const region = floor.length ? [[floor[0][0], s.axes.tw], ...floor, [top, floor[floor.length - 1][1]], [top, s.axes.tw]] : null;

    });
  },
};

      : `${fr(sub('W', 'engine'), mi('S'))}${mo('=')}${fr(fr(sub('T', 'SL'), sub('W', 'TO')) + fr(sub('W', 'TO'), mi('S')), fr(sub('T', 'SL'), sub('W', 'engine')))}`, isE() ? '10.11' : '')));
    const g = h(`<div class="ctls"></div>`);
    g.append(ctl(s, 'twEngine', { label: isE() ? 'Motor and propeller thrust-to-weight, T/W<sub>motor</sub>' : 'Engine thrust-to-weight, T<sub>SL</sub>/W<sub>engine</sub>', min: 0.5, max: 10, step: 0.1, d: 1, src: 'ex' }));
    el.append(g);
    el.append(h(`<div class="live" id="wLive"></div>`));
    el.append(h(`<p class="note">The chapter gets this ratio from wind tunnel tests of real motor and propeller pairs, and gives no value. The electric example uses 2.</p>`));
  },
  update() {
    const s = cur(); this.tb.querySelectorAll('tbody tr').forEach((tr, i) => { const c = s.comps[i]; $('.v', tr).textContent = f(c.w * c.r, 3); });
    $('#afTotal').textContent = f(airframeOf(s), 3) + ' lb/ft²';
    $('#wLive').textContent = `W_${isE() ? 'motor' : 'engine'}/S = ${f(s.tw, 3)} × ${f(s.wl)} / ${f(s.twEngine, 1)} = ${f(s.tw * s.wl / s.twEngine, 3)} lb/ft²`;
  },
};

P.size = {
  lede: 'The chosen wing loading is a budget. Whatever the airframe, energy and propulsion leave behind has to lift the payload, and that remainder sets the wing area.',
  build(el) {
    const s = cur();
    el.append(h(eq(`${mi('S')}${mo('=')}${fr(sub('W', 'payload'), fr(sub('W', 'TO'), mi('S')) + mo('-') + fr(sub('W', 'airframe'), mi('S')) + mo('-') + fr(sub('W', isE() ? 'battery' : 'fmission'), mi('S')) + mo('-') + fr(sub('W', isE() ? 'motor' : 'engine'), mi('S')))}<mspace width="2em"/>${sub('W', 'TO')}${mo('=')}${mi('S')}${paren(fr(sub('W', 'TO'), mi('S')))}`, isE() ? '10.6, 10.5' : '10.1, 10.5')));
    const g = h(`<div class="ctls"></div>`);
    g.append(ctl(s, 'Wp', { label: 'Payload weight, W<sub>payload</sub>', min: isE() ? 0.05 : 0.5, max: isE() ? 2 : 30, step: isE() ? 0.01 : 0.1, unit: 'lb', src: isE() ? 'ch' : 'ex' }));
    g.append(ctl(s, isE() ? 'tHr' : 'loiterMin', isE() ? { label: 'Mission duration, t', min: 0.25, max: 6, step: 0.05, unit: 'hr', src: 'ex' } : { label: 'Loiter time', min: 0, max: 600, step: 5, d: 0, unit: 'min', src: 'ex' }));
    el.append(g);
    el.append(h(`<h3>Wing loading budget</h3>`));
    el.append(h(`<div id="budget"></div>`));
    el.append(h(`<div class="live" id="sizeLive"></div>`));
    el.append(h(`<div id="sizeMsg"></div>`));
    el.append(h(`<h3>${isE() ? 'How long is too long' : 'How far can loiter go'}</h3>`));
    el.append(h(`<div id="sweep"></div>`));
    el.append(h(`<p class="note">As ${isE() ? 'duration' : 'loiter time'} grows, the payload's share of the budget shrinks toward zero, so the wing area climbs without limit. Past that point no aircraft of this technology level can fly the mission.</p>`));
  },
  update() {
    const s = cur(), r = solve(s), p = r.parts, left = Math.max(0, r.left);
    const items = [[p.airframe, 'Airframe', '--s1'], [p.energy, isE() ? 'Battery' : 'Mission fuel', '--s2'], [p.power, isE() ? 'Motor and prop' : 'Engine', '--s3'], [left, 'Payload', '--s4']];
    const total = items.reduce((a, i) => a + i[0], 0) || 1;
    $('#budget').innerHTML = `<div class="stack" role="img" aria-label="Wing loading split between airframe, energy, propulsion and payload">${items.map(i => `<div style="flex:${Math.max(i[0], 0.0001)} 1 0;background:var(${i[2]})" title="${i[1]} ${f(i[0], 3)} lb/ft²"></div>`).join('')}</div>
      <table class="tbl compact"><thead><tr><th>Slice</th><th>lb/ft²</th><th>Share</th><th>Weight, lb</th></tr></thead><tbody>${items.map(i => `<tr><td><i class="sw" style="background:var(${i[2]})"></i>${i[1]}</td><td class="num">${f(i[0], 3)}</td><td class="num">${f(i[0] / total * 100, 1)} %</td><td class="num">${r.feasible ? f(i[0] * r.S, 3) : '–'}</td></tr>`).join('')}</tbody></table>`;
    $('#sizeLive').textContent = `S = ${f(s.Wp)} / (${f(s.wl)} − ${f(p.airframe, 3)} − ${f(p.energy, 3)} − ${f(p.power, 3)}) = ${r.feasible ? f(r.S, 3) + ' ft²' : 'no solution'}`;
    $('#sizeMsg').innerHTML = !r.feasible
      ? callout(`<strong>No aircraft closes.</strong> The other slices use ${f((p.airframe + p.energy + p.power) / s.wl * 100, 0)} % of the wing loading, leaving nothing for payload. The chapter says this usually means the mission is too long, and that radical configuration changes or new technology, such as higher battery energy density, would be needed.`, 'warn')
      : isE() ? callout(`<strong>Check against the chapter.</strong> The Red Falcon sized to slightly over 1 ft² and slightly over 1 lb. This setup gives ${f(r.S)} ft² and ${f(r.W)} lb. The chapter does not state the mission time, so the example duration was set to land here.`, 'muted') : '';
    const pts = [];
    if (isE()) {
      for (let t = 0.1; t <= 6.01; t += 0.05) { const x = solve({ __proto__: s, tHr: t }); pts.push([t, x.feasible ? x.S : NaN]); }
    } else {
      for (let t = 0; t <= 600; t += 10) { const x = solve({ __proto__: s, legs: s.legs.map(l => l.id === 'lo' ? { ...l, dtMin: t } : l) }); pts.push([t, x.feasible ? x.S : NaN]); }
    }
    const curX = isE() ? s.tHr : s.loiterMin, base = r.feasible ? r.S : 2 * s.spanRef;
    const good = pts.filter(q => Number.isFinite(q[1]));
    plot($('#sweep'), {
      h: 260, aria: 'Wing area against mission duration',
      x: { min: 0, max: isE() ? 6 : 600, label: isE() ? 'Mission duration (hr)' : 'Loiter time (min)' }, y: { max: +(Math.max(base * 3, good.length ? good[0][1] * 3 : 1)).toPrecision(2), label: 'Wing area, S (ft²)' },
      series: [{ name: 'Wing area', color: '--s1', pts: good.length ? good : [[0, 0]] }], tipHead: x => isE() ? `${f(x)} hr` : `${f(x, 0)} min`,
      marks: r.feasible ? [{ x: curX, y: r.S, label: `${f(r.S)} ft²` }] : [],
    });
  },
};

P.iterate = {
  lede: 'Often the fuselage is sized by the payload, so only the wing and tail change. That changes the drag polar and the airframe weight, so the whole analysis must run again.',
  build(el) {
    const s = cur(), it = s.it;
    el.append(h(`<p>Start from the wing area you modelled. Run the analysis, get a recommended area, then feed it back in. The chapter warns that this loop can be unstable, and that averaging the old and new areas speeds convergence.</p>`));
    const g = h(`<div class="ctls"></div>`);
    g.append(ctl(it, 'Sref', { label: 'Modelled wing area', min: isE() ? 0.4 : 2, max: isE() ? 4 : 20, step: 0.05, unit: 'ft²', src: 'ex' }));
    g.append(ctl(it, 'dragShare', { label: 'Fuselage share of C<sub>Do</sub> at that area', min: 0, max: 0.8, step: 0.01, src: 'ex' }));
    g.append(ctl(it, 'weightShare', { label: 'Fuselage share of airframe weight', min: 0, max: 0.8, step: 0.01, src: 'ex' }));
    el.append(g);
    el.append(h(`<h3>Update rule</h3>`));
    el.append(seg(it, 'damp', [['true', 'Average with previous area'], ['false', 'Use the new area directly']]));
    el.append(h(`<div class="pill-row" id="itPill"></div>`));
    el.append(h(`<div id="itPlot"></div>`));
    el.append(h(`<div class="scroll"><table class="tbl compact"><thead><tr><th>Pass</th><th>Modelled S, ft²</th><th>C<sub>Do</sub></th><th>Needs T/W</th><th>New S, ft²</th></tr></thead><tbody id="itRows"></tbody></table></div>`));
    el.append(h(`<details><summary>How the fixed fuselage is modelled</summary><div><p>The chapter describes the effect but gives no formula, so this tool uses the simplest version. The fuselage keeps its drag area and weight while S changes, which rescales its share by S<sub>modelled</sub>/S. Everything else stays as on the earlier pages. On each pass T/W is reset to the same margin above the constraint lines, and W/S stays at your design point.</p></div></details>`));
  },
  update() {
    const s = cur(), it = s.it, cons0 = consOf(s, s.polar, s.wl), margin = s.tw / requiredTW(s.polar, s.wl, cons0, s.rho).tw;
    const r = iterateSizing(Sx => {
      const pS = polarAt(s.polar, it, Sx), cons = consOf(s, pS, s.wl), tw = requiredTW(pS, s.wl, cons, s.rho).tw * margin;
      const { parts } = partsOf(s, pS, s.wl, tw, airframeAt(airframeOf(s), it, Sx));
      return { ...sizeAircraft(s.wl, parts, s.Wp), CDo: pS.CDo, tw };
    }, it);
    const a = r.hist.map(x => [x.i + 1, x.S]), b = r.hist.filter(x => Number.isFinite(x.Snew)).map(x => [x.i + 1, x.Snew]);
    const top = Math.max(...a.map(q => q[1]), ...b.map(q => q[1])) * 1.15;
    plot($('#itPlot'), {
      h: 260, aria: 'Wing area at each pass of the sizing loop', x: { min: 0, max: Math.max(6, r.hist.length + 1), label: 'Pass' }, y: { max: +top.toPrecision(2), label: 'Wing area, S (ft²)' },
      series: [{ name: 'Modelled area', color: '--s1', pts: a, dots: 3.5 }, { name: 'Sizing equation result', color: '--s2', dash: '7 3', pts: b, dots: 3.5 }], tipHead: x => `Pass ${Math.round(x)}`,
    });
    $('#itRows').innerHTML = r.hist.map(x => `<tr><td class="num">${x.i + 1}</td><td class="num">${f(x.S, 3)}</td><td class="num">${f(x.CDo, 4)}</td><td class="num">${f(x.tw, 3)}</td><td class="num">${Number.isFinite(x.Snew) ? f(x.Snew, 3) : 'none'}</td></tr>`).join('');
    const msg = {
      converged: `<span class="pill ok"><b>✓</b> Converged at ${f(r.S)} ft² after ${r.hist.length} passes</span>`,
      notconverged: `<span class="pill bad"><b>✕</b> Still swinging after ${r.hist.length} passes</span>`,
      nosolution: `<span class="pill bad"><b>✕</b> Loop broke at pass ${r.hist.length}: the sizing equation has no solution there</span>`,
    }[r.status];
    $('#itPill').innerHTML = msg;
  },
};

P.optimize = {
  lede: 'Repeat the whole cycle across a family of configurations, then pick the one that meets every requirement at the smallest size.',
  build(el) {
    const s = cur();
    el.append(h(`<p>Each line is one wing family. Each point on a line is a different design wing loading, with thrust loading set by the constraint lines plus your current margin. Lower and further left means a smaller aircraft.</p>`));
    el.append(h(`<div class="pill-row"><div id="optPill"></div><button type="button" class="btn" id="useBest">Use lightest point</button></div>`));
    el.append(h(`<div id="carpet"></div>`));
    el.append(h(`<div class="scroll"><table class="tbl compact"><thead><tr><th>Family</th><th>Lightest W<sub>TO</sub>, lb</th><th>S, ft²</th><th>W/S, lb/ft²</th></tr></thead><tbody id="optRows"></tbody></table></div>`));
    el.append(h(callout(`The chapter's Fig. 10.6 varies aspect ratio, but gives no equation linking aspect ratio to the polar. This plot varies k<sub>1</sub>, the term aspect ratio changes, so it stays within the chapter's equations. The chapter's Red Falcon stopped at aspect ratio 4 because higher values saved little size and packed worse in a backpack. Weigh those practical limits too.`, 'muted')));
    $('#useBest', el).addEventListener('click', () => { if (this.best) { s.wl = +this.best.wl.toFixed(2); s.tw = +this.best.tw.toFixed(3); update(); } });
  },
  update() {
    const s = cur(), mult = [0.5, 0.7, 1, 1.4, 2], cons0 = consOf(s, s.polar, s.wl), margin = Math.max(1, s.tw / requiredTW(s.polar, s.wl, cons0, s.rho).tw);
    const limit = s.lim.on ? Math.min(wingLoadingLimit(s.lim, s.rho), s.axes.wl) : s.axes.wl;
    const series = [], table = [];
    mult.forEach((k, i) => {
      const pol = { ...s.polar, k1: s.polar.k1 * k }, pts = []; let best = null;
      for (let j = 4; j <= 40; j++) {
        const wl = limit * j / 40, tw = requiredTW(pol, wl, consOf(s, pol, wl), s.rho).tw * margin, r = solve(s, pol, wl, tw);
        if (!r.feasible || r.W > 1e3) continue;
        const o = [r.W, r.S, wl, tw]; pts.push(o); if (!best || r.W < best[0]) best = o;
      }
      series.push({ name: `k1 = ${f(pol.k1, 3)}`, color: COLORS[i], dash: DASHES[i], pts, best, k });
      table.push({ name: `k<sub>1</sub> = ${f(pol.k1, 3)}`, best });
    });
    const ref = series[2].best, here = solve(s);
    this.best = ref ? { wl: ref[2], tw: ref[3] } : null;
    $('#optPill').innerHTML = ref ? `<span class="pill ok"><b>✓</b> Lightest at your k<sub>1</sub>: ${f(ref[0])} lb, ${f(ref[1])} ft²</span>` : `<span class="pill bad"><b>✕</b> No wing loading closes at your k<sub>1</sub></span>`;
    $('#optRows').innerHTML = table.map(t => `<tr><td>${t.name}</td>${t.best ? `<td class="num">${f(t.best[0])}</td><td class="num">${f(t.best[1])}</td><td class="num">${f(t.best[2])}</td>` : '<td class="num" colspan="3">No solution</td>'}</tr>`).join('');
    const all = series.flatMap(x => x.pts), bx = all.length ? Math.min(...series.map(x => x.best ? x.best[0] : Infinity)) : 1;
    const xMax = all.length ? +(Math.min(Math.max(...all.map(q => q[0])), bx * 4) * 1.05).toPrecision(2) : 1;
    const inView = all.filter(q => q[0] <= xMax), yMax = inView.length ? +(Math.max(...inView.map(q => q[1])) * 1.1).toPrecision(2) : 1;
    plot($('#carpet'), {
      h: 360, aria: 'Carpet plot of wing area against takeoff weight', x: { min: 0, max: xMax, label: 'Takeoff weight (lb)' }, y: { max: yMax, label: 'Wing area (ft²)' },
      series: series.map(x => ({ ...x, pts: x.pts.map(q => [q[0], q[1], q[2]]) })),
      nearest: q => `<div class="tr"><span>Weight</span><b>${f(q[0])} lb</b></div><div class="tr"><span>Wing area</span><b>${f(q[1])} ft²</b></div><div class="tr"><span>W/S</span><b>${f(q[2])} lb/ft²</b></div>`,
      marks: here.feasible && here.W <= xMax && here.S <= yMax ? [{ type: 'plus', x: here.W, y: here.S, label: 'Your design' }] : [],
    });
  },
};

/* ---------- shell ---------- */
Object.defineProperty(state.fueled, 'loiterMin', {
  get() { return this.legs.find(l => l.id === 'lo').dtMin; }, set(v) { this.legs.find(l => l.id === 'lo').dtMin = v; }, enumerable: false, configurable: true,
});
let page = 'config';
function renderNav() {
  const t = titles();
  $('#nav').innerHTML = order.map((id, i) => `<a href="#${id}" class="nav-i" ${id === page ? 'aria-current="page"' : ''}><span class="n">${i + 1}</span>${t[id]}</a>`).join('');
  if (window.innerWidth <= 760) $('[aria-current]', $('#nav')).scrollIntoView({ inline: 'center', block: 'nearest' });
}
function renderPage() {
  sync = [];
  const main = $('#page'), t = titles(), [prev, next] = nextOf(page), pg = P[page];
  main.innerHTML = `<div class="crumb">${isE() ? 'Electric aircraft' : 'Fueled aircraft'}<span>/</span>${secs()[page]}</div><h1>${t[page]}</h1><p class="lede">${pg.lede}</p><div id="body" class="body"></div>
    <div class="pager">${prev ? `<a href="#${prev}">← ${t[prev]}</a>` : '<span></span>'}${next ? `<a href="#${next}">${t[next]} →</a>` : '<span></span>'}</div>`;
  pg.build($('#body'));
  renderNav();
  update();
}
function renderRail() {
  const s = cur(), r = solve(s), { missed } = checkDesign(s);
  const S = r.feasible ? r.S : null, b = S ? Math.sqrt(s.AR * S) : null;
  const host = $('#railSketch');
  if (host.offsetParent) {
    const W = host.clientWidth || 260, H = 210, sDraw = S ?? s.spanRef ** 2 / s.AR, bD = Math.sqrt(s.AR * sDraw);
    host.innerHTML = sketch({ S: sDraw, AR: s.AR, tail: state.tail, aft: state.noseClear, W, H, ppf: Math.min(W * .9 / Math.max(s.spanRef * 1.5, bD), (H - 40) / (.8 * Math.max(s.spanRef * 1.5, bD))), showBar: true });
    host.classList.toggle('ghost', !S);
  }
  $('#railStats').innerHTML = [['Wing area', S ? f(S) : '–', 'ft²'], ['Takeoff weight', S ? f(r.W) : '–', 'lb'], ['Span', b ? f(b) : '–', 'ft'], ['Wing loading', f(s.wl), 'lb/ft²'], ['Thrust loading', f(s.tw, 3), ''], [isE() ? 'Battery' : 'Fuel', f(r.parts.energy / s.wl * 100, 0), '% of W']]
    .map(([k, v, u]) => `<div><span>${k}</span><b>${v}</b><em>${u}</em></div>`).join('');
  $('#railPill').innerHTML = (!r.feasible ? `<span class="pill bad"><b>✕</b> Does not close</span>` : '') + pill(missed);
}
function update() {
  sync.forEach(fn => fn());
  P[page].update();
  renderRail();
}
function route() {
  const id = location.hash.slice(1);
  page = order.includes(id) ? id : 'config';
  renderPage();
  window.scrollTo(0, 0);
}
function boot() {
  const modeSeg = seg(state, 'mode', [['electric', 'Electric'], ['fueled', 'Fueled']], () => renderPage());
  $('#modeHost').append(modeSeg);
  $('#reset').addEventListener('click', () => {
    const fresh = presets()[state.mode];
    const t = state[state.mode]; const lo = Object.getOwnPropertyDescriptor(t, 'loiterMin');
    Object.keys(t).forEach(k => delete t[k]); Object.assign(t, fresh);
    if (lo) Object.defineProperty(t, 'loiterMin', lo);
    renderPage();
  });
  window.addEventListener('hashchange', route);
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(update, 120); });
  route();
}
boot();

</script>
</body>
</html>
